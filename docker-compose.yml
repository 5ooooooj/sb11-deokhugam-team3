services:
  postgres:
    image: postgres:16-alpine
    container_name: deokhugam-db
    environment:
      POSTGRES_DB: ${DB_NAME:-deokhugam}
      POSTGRES_USER: ${DB_USERNAME:-deokhugam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-deokhugam1234}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-deokhugam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: deokhugam-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DATASOURCE_USERNAME: ${DB_USERNAME}
      DATASOURCE_PASSWORD: ${DB_PASSWORD}
      AWS_CREDENTIALS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      AWS_CREDENTIALS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${S3_BUCKET_NAME}

volumes:
  postgres_data: