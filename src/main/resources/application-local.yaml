spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://postgres:5432/deokhugam
    username: deokhugam
    password: deokhugam1234
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
