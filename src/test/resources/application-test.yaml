spring:
  config:
    activate:
      on-profile: test

  batch:
    jdbc:
      initialize-schema: always

  datasource:
    url: jdbc:postgresql://localhost:5432/deokhugam
    driver-class-name: org.postgresql.Driver
    username: deokhugam
    password: deokhugam1234
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  flyway:
    enabled: false

  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop # 테스트 시작 시 테이블 생성, 종료 시 삭제하여 독립성 보장
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  sql:
    init:
      mode: never  # schema.sql 실행 안 함

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:test-access-key}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test-secret-key}
    region:
      static: ap-northeast-2
    s3:
      bucket: test-deokhugam-bucket
    stack:
      auto: false